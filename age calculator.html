<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <link rel="stylesheet" href="agestyle.css">
</head>
<body>
    <div class="cat"><img src="cat.jpg"></div>
 <div class="container">
    <div class="calculator">
      <h1>Age Calculator</h1>
      <p class="subtitle">Enter your date of birth</p>

      <div class="input-group">
        <label for="xyz">Date of Birth</label>
        <input type="date" id="xyz">
      </div>

      <button onclick="calculateAge()">Calculate Age</button>

      <div id="result" class="result">
        <h2>Your Age</h2>
        <div class="age">
          <span id="years">0</span>
          <small>Years</small>

          <span id="months">0</span>
          <small>Months</small>

          <span id="days">0</span>
          <small>Days</small>
        </div>
      </div>

      <p id="error" class="error"></p>
    </div>
  </div>

  <script src="agescript.js"></script>
</body>

</html>
